name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run check
      - run: npm --prefix frontend run build
      - run: test -z "$(gofmt -l -- *.go)"
      - run: go mod tidy -diff
      - run: go vet -tags headless ./...
      - run: go test -tags headless ./...
      - run: go build -tags headless -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o axi .
      - run: test "$(stat -c %s axi)" -le 15000000
